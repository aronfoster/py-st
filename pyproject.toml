[project]
name = "py-st"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "pydantic",
  "tenacity",
  "typer",
  "python-dotenv",
  "responses>=0.25.0",
]

[project.optional-dependencies]
# Keep formatters aligned with .pre-commit-config.yaml.
dev = ["black==24.8.0", "ruff==0.6.9", "mypy", "pytest", "pre-commit"]
browser = ["playwright"]

[project.scripts]
py-st = "py_st.cli.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
py_st = ["services/*.html"]

[tool.black]
line-length = 79
target-version = ["py311"]
extend-exclude = "src/py_st/_generated"

[tool.ruff]
line-length = 79
fix = false
target-version = "py311"
exclude = [
  "src/py_st/_generated",
]
lint.select = ["E","F","I","UP","B","SIM"]
lint.extend-select = ["W505"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^build/", "^dist/"]

[[tool.mypy.overrides]]
module = "py_st._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true
