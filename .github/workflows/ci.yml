name: ci
on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      ST_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and rebuild browser foundation
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code -- ../src/py_st/services/ui
          if [ -n "$(git status --porcelain --untracked-files=all -- ../src/py_st/services/ui)" ]; then
            git status --short --untracked-files=all -- ../src/py_st/services/ui
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tools & libs (match local)
        run: |
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check --no-fix .

      - name: Black (79 cols)
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q

      - name: Browser dependencies
        run: |
          pip install -e '.[browser]'
          if ! command -v google-chrome >/dev/null; then
            python -m playwright install --with-deps chrome
          fi

      - name: Browser gameplay and dense Explorer
        env:
          DASHBOARD_BROWSER_TESTS: '1'
        run: |
          mkdir -p .cache/nightly
          pytest tests/test_flight.py tests/test_dashboard.py -q --maxfail=1 \
            --basetemp=.cache/nightly/ci-browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: .cache/nightly/ci-browser/**/*.png
          if-no-files-found: ignore
