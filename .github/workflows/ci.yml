name: ci
on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      ST_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and rebuild browser foundation
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code -- ../src/py_st/services/ui

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tools & libs (match local)
        run: |
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check --no-fix .

      - name: Black (79 cols)
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest -q
